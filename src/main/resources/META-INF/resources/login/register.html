<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #0a0e17;
            color: #e0e0e0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .register-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .register-card {
            width: 100%;
            max-width: 500px;
            background-color: #111827;
            border: 1px solid #2d3748;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(160, 32, 240, 0.3);
        }

        .register-card h2 {
            color: #c8aa6e;
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .form-label {
            color: #c8aa6e;
        }

        .form-control {
            background-color: #1f2937;
            color: white;
            border: 1px solid #4b5563;
        }

        .form-control:focus {
            background-color: #1f2937;
            color: white;
            border-color: #a020f0;
            box-shadow: 0 0 0 0.2rem rgba(160, 32, 240, 0.25);
        }

        .btn-register {
            background-color: #a020f0;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-weight: bold;
        }

        .btn-register:hover {
            background-color: #7b16bd;
            color: white;
        }

        .btn-back {
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="register-container">
    <div class="register-card">
        <h2>회원가입</h2>

        <form id="registerForm" action="/register_check" method="post">

            <div class="mb-3">
                <label for="username" class="form-label">아이디</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>

            <div class="mb-3">
                <label for="rawPassword" class="form-label">비밀번호</label>
                <input type="password" class="form-control" id="rawPassword" required>
            </div>

            <!-- 서버로 실제 전송되는 해시 비밀번호 -->
            <input type="hidden" id="password" name="password">

            <div class="mb-3">
                <label for="email" class="form-label">이메일</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label">전화번호</label>
                <input type="text" class="form-control" id="phone" name="phone" required>
            </div>

            <button type="submit" class="btn btn-register">회원가입</button>
            <a href="/login" class="btn btn-secondary btn-back">로그인으로 돌아가기</a>
        </form>
    </div>
</div>

<script>
    async function hashPassword(password) {
        const encoder = new TextEncoder();
        const data = encoder.encode(password);
        const hashBuffer = await crypto.subtle.digest("SHA-256", data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));

        return hashArray
            .map(byte => byte.toString(16).padStart(2, "0"))
            .join("");
    }

    document.getElementById("registerForm").addEventListener("submit", async function (event) {
        event.preventDefault();

        const rawPassword = document.getElementById("rawPassword").value;
        const hashedPassword = await hashPassword(rawPassword);

        document.getElementById("password").value = hashedPassword;

        console.log("원본 비밀번호:", rawPassword);
        console.log("SHA-256 해시값:", hashedPassword);
        console.log("해시 길이:", hashedPassword.length);

        this.submit();
    });
</script>

</body>
</html>
