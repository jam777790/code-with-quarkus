<section class="hero d-flex align-items-center justify-content-center text-center py-5">
    <div class="container" style="max-width: 400px;">
        <h2 class="fw-bold mb-4">로그인</h2>

        <form method="POST" action="/login_check" id="loginForm">
            <div class="mb-3 text-start">
                <label class="form-label">아이디</label>
                <input type="text"
                       class="form-control"
                       id="usernameInput"
                       name="username"
                       placeholder="아이디 입력"
                       required>
                <div class="invalid-feedback" id="usernameMsg"></div>
            </div>

            <div class="mb-3 text-start">
                <label class="form-label">패스워드</label>

                <!-- 사용자가 직접 입력하는 원본 비밀번호 -->
                <input type="password"
                       class="form-control"
                       id="passwordInput"
                       placeholder="비밀번호 입력"
                       required>

                <div class="invalid-feedback" id="passwordMsg"></div>

                <!-- 서버로 전송되는 SHA-256 해시값 -->
                <input type="hidden" id="password" name="password">
            </div>

            <button type="submit" class="btn btn-primary w-100">로그인</button>

            <hr>

            <a href="/register" class="btn btn-outline-secondary w-100">
                회원가입
            </a>
        </form>
    </div>
</section>

<script>
    async function hashPassword(password) {
        const encoder = new TextEncoder();
        const data = encoder.encode(password);
        const hashBuffer = await crypto.subtle.digest("SHA-256", data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));

        return hashArray
            .map(byte => byte.toString(16).padStart(2, "0"))
            .join("");
    }

    document.getElementById("loginForm").addEventListener("submit", async function (event) {
        event.preventDefault();

        const username = document.getElementById("usernameInput").value.trim();
        const rawPassword = document.getElementById("passwordInput").value;

        console.log("=================================");
        console.log("=== [LOGIN FORM 디버깅]");
        console.log("username:", username);
        console.log("rawPassword:", rawPassword);
        console.log("rawPassword length:", rawPassword.length);

        if (username.length === 0) {
            alert("아이디를 입력하세요.");
            return;
        }

        if (rawPassword.length === 0) {
            alert("비밀번호를 입력하세요.");
            return;
        }

        const hashedPassword = await hashPassword(rawPassword);

        document.getElementById("password").value = hashedPassword;

        console.log("hashedPassword:", hashedPassword);
        console.log("hashedPassword length:", hashedPassword.length);
        console.log("hidden password value:", document.getElementById("password").value);
        console.log("=================================");

        this.submit();
    });
</script>
